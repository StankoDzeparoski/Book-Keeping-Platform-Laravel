name: Build and Publish Container Images

on:
  push:
    branches:
      - KIIUprades
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"

          echo "app=ghcr.io/${repository}/app" >> "$GITHUB_OUTPUT"
          echo "nginx=ghcr.io/${repository}/nginx" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Laravel PHP-FPM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.images.outputs.app }}:${{ steps.images.outputs.short_sha }}
            ${{ steps.images.outputs.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: nginx
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.images.outputs.nginx }}:${{ steps.images.outputs.short_sha }}
            ${{ steps.images.outputs.nginx }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
