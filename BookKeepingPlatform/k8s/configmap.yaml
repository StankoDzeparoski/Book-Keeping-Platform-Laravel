apiVersion: v1
kind: ConfigMap
metadata:
  name: bookkeeping-app-config
  namespace: bookkeeping-platform
data:
  APP_NAME: "BookKeeping Platform"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://bookkeeping.local"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "en_US"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "pgsql"
  DB_HOST: "bookkeeping-postgres"
  DB_READ_HOST: "bookkeeping-postgres-replica"
  DB_PORT: "5432"
  SESSION_DRIVER: "database"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"
  WAIT_FOR_DB: "true"
  RUN_MIGRATIONS: "false"
