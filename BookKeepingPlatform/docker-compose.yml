services:
  nginx:
    build:
      context: .
      target: nginx
    image: bookkeeping-platform-nginx:local
    environment:
      PHP_FPM_HOST: app
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    image: bookkeeping-platform-app:local
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-bookkeeping}
      DB_USERNAME: ${DB_USERNAME:-bookkeeping}
      DB_PASSWORD: ${DB_PASSWORD:-bookkeeping}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "false"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bookkeeping}
      POSTGRES_USER: ${DB_USERNAME:-bookkeeping}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookkeeping}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
